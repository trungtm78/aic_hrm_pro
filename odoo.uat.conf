[options]
; UAT server for AIConnect HRM Pro.
;
; A third database, deliberately. odoo.conf runs the working database that
; holds a real customer's imported plan; odoo.demo.conf runs the sales demo.
; Neither may be used for acceptance testing: UAT data is broken on purpose
; - scorecards that must refuse to submit, cycles that must refuse to change,
; feedback that must stay hidden - and that belongs nowhere near either.
;
; dbfilter locks the selector to this one database. Twice this project has
; captured screenshots of live customer data because a staging process read
; the default config; the lock is the fix, not the intention to be careful.
;
;   python odoo-bin -c odoo.uat.conf
;   http://127.0.0.1:8075  ->  uat_admin / uat_demo_2026  (or admin / admin)

admin_passwd = aic_hrm_admin_2026
db_host = 127.0.0.1
db_port = 5433
db_user = odoo
db_password = odoo
db_name = AIC_HRM_UAT
dbfilter = ^AIC_HRM_UAT$
list_db = False
addons_path = C:/AIConnect/AIC_HRM_Pro/addons,C:/AIConnect/AIC_HRM_Pro/addons_hrm,C:/AIConnect/AIC_HRM_Pro/addons_third
http_port = 8075
xmlrpc_port = 8075
logfile = False
log_level = warn
limit_time_cpu = 600
limit_time_real = 1200
workers = 0
