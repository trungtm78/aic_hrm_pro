[options]
; Demo server for AIConnect HRM Pro.
;
; Separate from odoo.conf on purpose: that one runs the working database
; with a real customer's data in it, and a demo should never be one
; wrong click away from showing it. This one is locked to the demo
; database with db_filter, so the database selector cannot reach
; anything else even if someone goes looking.
;
; The dataset is the fictional one that ships with the app - Acme
; Digital, international names - which is also exactly what a buyer sees
; after installing.
;
;   python odoo-bin -c odoo.demo.conf
;   http://127.0.0.1:8074  ->  admin / admin

admin_passwd = aic_hrm_admin_2026
db_host = 127.0.0.1
db_port = 5433
db_user = odoo
db_password = odoo
db_name = AIC_HRM_Demo
dbfilter = ^AIC_HRM_Demo$
list_db = False
addons_path = C:/AIConnect/AIC_HRM_Pro/addons,C:/AIConnect/AIC_HRM_Pro/addons_hrm,C:/AIConnect/AIC_HRM_Pro/addons_third
http_port = 8074
xmlrpc_port = 8074
logfile = False
log_level = warn
limit_time_cpu = 300
limit_time_real = 600
workers = 0
